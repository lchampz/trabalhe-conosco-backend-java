<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${id} != null ? 'Editar cartório' : 'Novo cartório'"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: topbar('cartorios')}"></header>

<main>
    <h1 th:text="${id} != null ? 'Editar cartório' : 'Novo cartório'"></h1>

    <form class="formulario" th:action="${id} != null ? @{/cartorios/{id}(id=${id})} : @{/cartorios}"
          th:object="${cartorioRequest}" method="post">

        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}">
            <div class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>

        <div class="grid-2">
            <div class="campo">
                <label for="cep">CEP</label>
                <input type="text" id="cep" th:field="*{cep}">
                <div class="erro-campo" th:if="${#fields.hasErrors('cep')}" th:errors="*{cep}"></div>
            </div>
            <div class="campo">
                <label for="numero">Número</label>
                <input type="text" id="numero" th:field="*{numero}">
                <div class="erro-campo" th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}"></div>
            </div>
        </div>

        <div class="campo">
            <label for="rua">Rua</label>
            <input type="text" id="rua" th:field="*{rua}">
            <div class="erro-campo" th:if="${#fields.hasErrors('rua')}" th:errors="*{rua}"></div>
        </div>

        <div class="grid-2">
            <div class="campo">
                <label for="complemento">Complemento</label>
                <input type="text" id="complemento" th:field="*{complemento}">
            </div>
            <div class="campo">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" th:field="*{bairro}">
            </div>
        </div>

        <div class="grid-2">
            <div class="campo">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" th:field="*{cidade}">
                <div class="erro-campo" th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}"></div>
            </div>
            <div class="campo">
                <label for="uf">UF</label>
                <input type="text" id="uf" th:field="*{uf}" maxlength="2">
                <div class="erro-campo" th:if="${#fields.hasErrors('uf')}" th:errors="*{uf}"></div>
            </div>
        </div>

        <fieldset class="certidoes">
            <legend>Certidões emitidas</legend>
            <div class="opcoes-certidao">
                <label th:each="certidao : ${certidoesDisponiveis}">
                    <input type="checkbox" th:field="*{certidoes}" th:value="${certidao.id}">
                    <span th:text="${certidao.nome}"></span>
                </label>
            </div>
        </fieldset>
        <div class="erro-campo" th:if="${#fields.hasErrors('certidoes')}" th:errors="*{certidoes}"></div>

        <div class="acoes-form">
            <button class="btn btn-primary" type="submit">Salvar</button>
            <a class="btn btn-secondary" th:href="@{/cartorios}">Cancelar</a>
        </div>
    </form>
</main>

</body>
</html>
