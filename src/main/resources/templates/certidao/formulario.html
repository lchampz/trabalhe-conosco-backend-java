<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${id} != null ? 'Editar certidão' : 'Nova certidão'"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: topbar('certidoes')}"></header>

<main>
    <h1 th:text="${id} != null ? 'Editar certidão' : 'Nova certidão'"></h1>

    <form class="formulario" th:action="${id} != null ? @{/certidoes/{id}(id=${id})} : @{/certidoes}"
          th:object="${certidaoRequest}" method="post">

        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}">
            <div class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>

        <div class="acoes-form">
            <button class="btn btn-primary" type="submit">Salvar</button>
            <a class="btn btn-secondary" th:href="@{/certidoes}">Cancelar</a>
        </div>
    </form>
</main>

</body>
</html>
